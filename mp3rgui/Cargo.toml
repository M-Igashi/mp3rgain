[package]
name = "mp3rgui"
version = "3.3.0"
edition = "2021"
authors = ["Jesse Pinkman <M-Igashi@users.noreply.github.com>"]
description = "GUI application for mp3rgain - lossless MP3 volume adjustment"
license = "MIT"
repository = "https://github.com/M-Igashi/mp3rgain"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mp3rgain = { path = "..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

# Linux: use GTK3 backend to avoid ashpd/xdg-portal compilation issues
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

# macOS/Windows: use native file dialogs
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

# Windows: also compile the wgpu backend. The glow backend needs an OpenGL 2.0+
# ICD, which many Windows machines lack (issue #282); wgpu reaches the same
# screen through D3D12 / Vulkan. Both are built so MP3RGUI_RENDERER can switch.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", features = ["persistence", "wgpu"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
