[package]
name = "mp3rgain"
version = "3.10.0"
edition = "2021"
rust-version = "1.85"
authors = ["Jesse Pinkman <M-Igashi@users.noreply.github.com>"]
description = "Lossless MP3/AAC volume adjustment - a modern mp3gain / aacgain replacement written in Rust"
license = "MIT"
repository = "https://github.com/M-Igashi/mp3rgain"
homepage = "https://mp3rgain.tyna.ninja"
readme = "README.md"
keywords = ["mp3", "audio", "gain", "volume", "lossless"]
categories = ["multimedia::audio", "command-line-utilities"]
exclude = ["mp3rgui/", "target/", "packages/", "docs/", "scripts/", ".github/", ".claude/", "tests/", "CLAUDE.md", "flake.nix", "flake.lock"]

[features]
default = ["replaygain", "aac"]
replaygain = ["symphonia"]
aac = ["symphonia-aac"]
symphonia-aac = ["symphonia"]
serde = []

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
colored = "3.1"
symphonia = { version = "0.6.0", optional = true, default-features = false, features = ["mp3", "aac", "isomp4", "all-meta"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
id3 = "1"
indicatif = "0.18"
rayon = "1.10"

[lib]
name = "mp3rgain"
path = "src/lib.rs"

[[bin]]
name = "mp3rgain"
path = "src/main.rs"
required-features = ["replaygain", "aac"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[package.metadata.docs.rs]
# `serde` is off by default, so without this docs.rs omits the Serialize /
# Deserialize impls on the public result types.
all-features = true
