version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    # dtolnay/rust-toolchain force-pushes its branches (stable/nightly/1.x)
    # whenever Rust releases, so old SHAs become unreachable. Dependabot's
    # find_container_branch fails with "no such commit" on every run.
    # Bump the SHA manually when Rust stable changes.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
