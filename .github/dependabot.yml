version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/mp3rgui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      rust-dependencies:
        patterns:
          - "*"
    # egui 0.x releases break the API and eframe / egui / egui_extras must move
    # together (#372 paired egui 0.33 with egui_extras 0.34), so the GUI stack
    # is upgraded by hand. Patch releases still come through.
    ignore:
      - dependency-name: "egui*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rfd"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    # dtolnay/rust-toolchain force-pushes its branches (stable/nightly/1.x)
    # whenever Rust releases, so old SHAs become unreachable. Dependabot's
    # find_container_branch fails with "no such commit" on every run.
    # Bump the SHA manually when Rust stable changes.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
