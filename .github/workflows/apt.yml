name: apt Repository

# Publishes a signed flat apt repository as assets of a release (issue #394):
# Packages, Packages.gz, Release, Release.gpg, InRelease and the public key,
# indexing the release's own .deb files. Users point apt at
# https://github.com/M-Igashi/mp3rgain/releases/latest/download/ so that
# `apt update` follows the newest release with no hosting of its own.
#
# Separate from release.yml, like ppa.yml and docker.yml, so the index can be
# rebuilt for a release without cutting a new tag.
#
# Required secret (`apt` environment, deployable from master only):
#   APT_GPG_PRIVATE_KEY - ASCII-armored private key without a passphrase. Its
#                         public half is packages/apt/mp3rgain-archive-keyring.gpg.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to index, e.g. 3.10.0. Default: the version in Cargo.toml."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: Publish apt index
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: apt
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the Release run built, not master: update-aur pushes
          # to master before this run starts (issue #380).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir repo
          ls -la repo

      - name: Build and sign the index
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          command -v apt-ftparchive || { sudo apt-get update && sudo apt-get install -y apt-utils; }
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          cp packages/apt/mp3rgain-archive-keyring.gpg repo/
          cd repo
          apt-ftparchive packages . > Packages
          gzip -9kn Packages
          # Written outside the directory so the Release file does not list itself.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=mp3rgain \
            -o APT::FTPArchive::Release::Label=mp3rgain \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Description="mp3rgain and mp3rgui" \
            release . > ../Release
          mv ../Release Release
          gpg --batch --yes --digest-algo SHA512 --clearsign -o InRelease Release
          gpg --batch --yes --digest-algo SHA512 --armor --detach-sign -o Release.gpg Release
          # apt verifies against the published key, so check that it signed this.
          gpgv --keyring ./mp3rgain-archive-keyring.gpg InRelease
          gpgv --keyring ./mp3rgain-archive-keyring.gpg Release.gpg Release
          cat Release

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd repo
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            Packages Packages.gz Release Release.gpg InRelease mp3rgain-archive-keyring.gpg

      # Install the way the README says, from releases/latest, with apt's
      # gpgv on the runner and sqv on Debian 13. Only meaningful when this
      # release is the latest one.
      - name: Install from the repository
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$LATEST" != "v$VERSION" ]; then
            echo "v$VERSION is not the latest release ($LATEST); skipping"
            exit 0
          fi
          cat > install.sh <<'EOF'
          set -eu
          BASE=https://github.com/M-Igashi/mp3rgain/releases/latest/download
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSLo /etc/apt/keyrings/mp3rgain.gpg "$BASE/mp3rgain-archive-keyring.gpg"
          echo "deb [signed-by=/etc/apt/keyrings/mp3rgain.gpg] $BASE/ ./" > /etc/apt/sources.list.d/mp3rgain.list
          apt-get update
          apt-get install -y mp3rgain
          mp3rgain -v
          mp3rgain -v | grep -F "$1"
          EOF
          sudo bash install.sh "$VERSION"
          docker run --rm -v "$PWD/install.sh:/install.sh:ro" debian:trixie \
            bash -c 'apt-get update && apt-get install -y curl ca-certificates && bash /install.sh "$0"' "$VERSION"
