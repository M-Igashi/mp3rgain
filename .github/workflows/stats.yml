name: Download Stats

on:
  schedule:
    - cron: "0 9 * * *" # Every day 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Collect GitHub Releases stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases --paginate \
            --jq '[.[] | {
              tag: .tag_name,
              date: .published_at,
              assets: [.assets[] | {name, download_count}]
            }]' > /tmp/github_releases.json

      - name: Collect crates.io stats
        run: |
          curl -sf -H 'User-Agent: mp3rgain-stats' \
            'https://crates.io/api/v1/crates/mp3rgain' \
            | jq '{
              total_downloads: .crate.downloads,
              recent_downloads: .crate.recent_downloads,
              versions: [.versions[] | {num, downloads, created_at}]
            }' > /tmp/crates_io.json

      - name: Collect pkgstats (Arch install counts)
        run: |
          # The bare /api/packages/<pkg> endpoint returns only the most recent
          # *closed* month, so the dashboard appears stuck until the next month
          # closes. Use /series with an explicit window so the open month is
          # included and we can also expose monthly history for trend charts.
          END_MONTH=$(date -u +%Y%m)
          START_MONTH=$(date -u -d '11 months ago' +%Y%m)
          for pkg in mp3rgain-bin mp3rgui; do
            curl -sf "https://pkgstats.archlinux.de/api/packages/${pkg}/series?startMonth=${START_MONTH}&endMonth=${END_MONTH}" \
              -o "/tmp/pkgstats_${pkg}_series.json" \
              || echo '{"packagePopularities":[]}' > "/tmp/pkgstats_${pkg}_series.json"
          done
          jq -n \
            --slurpfile cli /tmp/pkgstats_mp3rgain-bin_series.json \
            --slurpfile gui /tmp/pkgstats_mp3rgui_series.json \
            '
            def summarize($name):
              ((.packagePopularities // []) | sort_by(.startMonth)) as $pops
              | ($pops | last) as $latest
              | {
                  name: $name,
                  count: ($latest.count // 0),
                  samples: ($latest.samples // 0),
                  popularity: ($latest.popularity // 0),
                  startMonth: ($latest.startMonth // null),
                  endMonth: ($latest.endMonth // null),
                  series: [$pops[] | {month: .startMonth, count: (.count // 0), samples: (.samples // 0), popularity: (.popularity // 0)}]
                };
            [
              ($cli[0] | summarize("mp3rgain-bin")),
              ($gui[0] | summarize("mp3rgui"))
            ]
            ' > /tmp/pkgstats.json

      - name: Collect AUR popularity
        run: |
          curl -sf 'https://aur.archlinux.org/rpc/?v=5&type=info&arg[]=mp3rgain-bin&arg[]=mp3rgui' \
            -o /tmp/aur_raw.json || echo '{"results":[]}' > /tmp/aur_raw.json
          jq '{
                packages: [.results[] | {
                  name: .Name,
                  votes: .NumVotes,
                  popularity: .Popularity,
                  maintainer: .Maintainer,
                  last_modified: .LastModified
                }]
              }' /tmp/aur_raw.json > /tmp/aur.json

      - name: Collect GHCR (Docker) metadata
        run: |
          OWNER=m-igashi
          PKG=mp3rgain
          IMAGE="ghcr.io/${OWNER}/${PKG}"
          # Anonymous pull token for the public image
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:${OWNER}/${PKG}:pull&service=ghcr.io" \
            | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo '{}' > /tmp/ghcr.json
            exit 0
          fi
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json"
          MLIST=$(curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${OWNER}/${PKG}/manifests/latest") || MLIST=""
          if [ -z "$MLIST" ]; then
            echo '{}' > /tmp/ghcr.json
            exit 0
          fi
          M_ACCEPT="application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
          PLATFORMS='[]'
          LATEST_PUSHED=""
          while IFS=$'\t' read -r ARCH DIGEST; do
            [ -z "$ARCH" ] && continue
            M=$(curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: $M_ACCEPT" \
              "https://ghcr.io/v2/${OWNER}/${PKG}/manifests/${DIGEST}") || continue
            SIZE=$(echo "$M" | jq '[.layers[].size] | add // 0')
            CONFIG_DIGEST=$(echo "$M" | jq -r '.config.digest // empty')
            CREATED=""
            if [ -n "$CONFIG_DIGEST" ]; then
              # -L is required: GHCR 307-redirects blob fetches to a CDN host.
              CREATED=$(curl -sLf -H "Authorization: Bearer $TOKEN" \
                "https://ghcr.io/v2/${OWNER}/${PKG}/blobs/${CONFIG_DIGEST}" \
                | jq -r '.created // empty')
            fi
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg arch "$ARCH" --argjson size "$SIZE" \
              '. + [{arch: $arch, size_bytes: $size}]')
            if [ -n "$CREATED" ] && { [ -z "$LATEST_PUSHED" ] || [ "$CREATED" \> "$LATEST_PUSHED" ]; }; then
              LATEST_PUSHED="$CREATED"
            fi
          done < <(echo "$MLIST" | jq -r '.manifests[] | [.platform.architecture, .digest] | @tsv')
          TAGS=$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://ghcr.io/v2/${OWNER}/${PKG}/tags/list" \
            | jq '.tags // []') || TAGS='[]'
          jq -n \
            --arg image "$IMAGE" \
            --arg pushed "$LATEST_PUSHED" \
            --argjson platforms "$PLATFORMS" \
            --argjson tags "$TAGS" \
            '{
              image: $image,
              platforms: $platforms,
              tags: $tags,
              latest_pushed: (if $pushed == "" then null else $pushed end)
            }' > /tmp/ghcr.json
          cat /tmp/ghcr.json

      - name: Collect PPA download stats
        run: |
          collect_ppa() {
            local ppa=$1
            local out=$2
            local entries='[]'
            local next="https://api.launchpad.net/1.0/~m-igashi/+archive/ubuntu/${ppa}?ws.op=getPublishedBinaries&order_by_date=true"
            while [ -n "$next" ] && [ "$next" != "null" ]; do
              local page
              page=$(curl -sf "$next") || break
              entries=$(jq -s 'add' <(echo "$entries") <(echo "$page" | jq '.entries'))
              next=$(echo "$page" | jq -r '.next_collection_link // empty')
            done
            local enriched='[]'
            local count i
            count=$(echo "$entries" | jq 'length')
            i=0
            while [ "$i" -lt "$count" ]; do
              local self version arch series build dl
              self=$(echo "$entries" | jq -r ".[$i].self_link")
              version=$(echo "$entries" | jq -r ".[$i].binary_package_version")
              arch=$(echo "$entries" | jq -r ".[$i].distro_arch_series_link | split(\"/\") | .[-1]")
              series=$(echo "$entries" | jq -r ".[$i].distro_arch_series_link | split(\"/\") | .[-2]")
              build=$(echo "$entries" | jq -r ".[$i].build_link")
              dl=$(curl -sf "${self}?ws.op=getDownloadCount" || echo 0)
              [ -z "$dl" ] && dl=0
              enriched=$(jq -c \
                --arg v "$version" --arg a "$arch" --arg s "$series" --arg b "$build" --argjson d "$dl" \
                '. + [{version: $v, arch: $a, series: $s, build: $b, downloads: $d}]' <(echo "$enriched"))
              i=$((i + 1))
            done
            # Collapse publications sharing the same build (e.g. amd64 and
            # amd64v3 variants of the same Launchpad build): sum downloads and
            # display only the baseline arch (strip trailing vN suffix).
            local grouped
            grouped=$(echo "$enriched" | jq '
              group_by(.build)
              | map({
                  version: .[0].version,
                  series: .[0].series,
                  arch: (map(.arch | sub("v[0-9]+$"; "")) | unique | join(" / ")),
                  downloads: (map(.downloads) | add)
                })
            ')
            local total
            total=$(echo "$grouped" | jq '[.[].downloads] | add // 0')
            jq -n --arg ppa "$ppa" --argjson total "$total" --argjson items "$grouped" \
              '{ppa: $ppa, total_downloads: $total, items: $items}' > "$out"
          }
          collect_ppa mp3rgain /tmp/ppa_cli.json
          collect_ppa mp3rgui /tmp/ppa_gui.json

      - name: Build stats snapshot
        run: |
          DATE=$(date -u +%Y-%m-%d)
          jq -n \
            --arg date "$DATE" \
            --slurpfile gh /tmp/github_releases.json \
            --slurpfile crates /tmp/crates_io.json \
            --slurpfile pkgstats /tmp/pkgstats.json \
            --slurpfile aur /tmp/aur.json \
            --slurpfile ppa_cli /tmp/ppa_cli.json \
            --slurpfile ppa_gui /tmp/ppa_gui.json \
            --slurpfile ghcr /tmp/ghcr.json \
            '{
              date: $date,
              github_releases: $gh[0],
              crates_io: $crates[0],
              pkgstats: $pkgstats[0],
              aur: $aur[0],
              ppa_cli: $ppa_cli[0],
              ppa_gui: $ppa_gui[0],
              ghcr: $ghcr[0]
            }' > /tmp/snapshot.json

      - name: Append to history
        run: |
          mkdir -p data
          if [ -f data/stats.json ]; then
            # Remove existing entry for the same date, then append
            DATE=$(date -u +%Y-%m-%d)
            jq --arg date "$DATE" '[.[] | select(.date != $date)]' data/stats.json > /tmp/existing.json
            jq -s '.[0] + [.[1]]' /tmp/existing.json /tmp/snapshot.json > data/stats.json
          else
            jq -s '.' /tmp/snapshot.json > data/stats.json
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update download stats $(date -u +%Y-%m-%d)"
          git push
