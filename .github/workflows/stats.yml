name: Download Stats

on:
  schedule:
    - cron: "0 9 * * *" # Every day 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: gh-pages

      - name: Collect GitHub Releases stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases --paginate \
            --jq '[.[] | {
              tag: .tag_name,
              date: .published_at,
              assets: [.assets[] | {name, download_count}]
            }]' > /tmp/github_releases.json

      - name: Collect crates.io stats
        run: |
          curl -sf -H 'User-Agent: mp3rgain-stats' \
            'https://crates.io/api/v1/crates/mp3rgain' \
            | jq '{
              total_downloads: .crate.downloads,
              recent_downloads: .crate.recent_downloads,
              versions: [.versions[] | {num, downloads, created_at}]
            }' > /tmp/crates_io.json

      - name: Collect pkgstats (Arch install counts)
        run: |
          for pkg in mp3rgain-bin mp3rgui; do
            curl -sf "https://pkgstats.archlinux.de/api/packages/${pkg}" \
              -o "/tmp/pkgstats_${pkg}.json" || echo '{}' > "/tmp/pkgstats_${pkg}.json"
          done
          jq -s '[.[0] + {name: "mp3rgain-bin"}, .[1] + {name: "mp3rgui"}]' \
            /tmp/pkgstats_mp3rgain-bin.json /tmp/pkgstats_mp3rgui.json \
            > /tmp/pkgstats.json

      - name: Collect PPA download stats
        run: |
          collect_ppa() {
            local ppa=$1
            local out=$2
            local entries='[]'
            local next="https://api.launchpad.net/1.0/~m-igashi/+archive/ubuntu/${ppa}?ws.op=getPublishedBinaries&order_by_date=true"
            while [ -n "$next" ] && [ "$next" != "null" ]; do
              local page
              page=$(curl -sf "$next") || break
              entries=$(jq -s 'add' <(echo "$entries") <(echo "$page" | jq '.entries'))
              next=$(echo "$page" | jq -r '.next_collection_link // empty')
            done
            local enriched='[]'
            local count i
            count=$(echo "$entries" | jq 'length')
            i=0
            while [ "$i" -lt "$count" ]; do
              local self version arch series build dl
              self=$(echo "$entries" | jq -r ".[$i].self_link")
              version=$(echo "$entries" | jq -r ".[$i].binary_package_version")
              arch=$(echo "$entries" | jq -r ".[$i].distro_arch_series_link | split(\"/\") | .[-1]")
              series=$(echo "$entries" | jq -r ".[$i].distro_arch_series_link | split(\"/\") | .[-2]")
              build=$(echo "$entries" | jq -r ".[$i].build_link")
              dl=$(curl -sf "${self}?ws.op=getDownloadCount" || echo 0)
              [ -z "$dl" ] && dl=0
              enriched=$(jq -c \
                --arg v "$version" --arg a "$arch" --arg s "$series" --arg b "$build" --argjson d "$dl" \
                '. + [{version: $v, arch: $a, series: $s, build: $b, downloads: $d}]' <(echo "$enriched"))
              i=$((i + 1))
            done
            # Collapse publications sharing the same build (e.g. amd64 and
            # amd64v3 variants of the same Launchpad build): sum downloads and
            # display only the baseline arch (strip trailing vN suffix).
            local grouped
            grouped=$(echo "$enriched" | jq '
              group_by(.build)
              | map({
                  version: .[0].version,
                  series: .[0].series,
                  arch: (map(.arch | sub("v[0-9]+$"; "")) | unique | join(" / ")),
                  downloads: (map(.downloads) | add)
                })
            ')
            local total
            total=$(echo "$grouped" | jq '[.[].downloads] | add // 0')
            jq -n --arg ppa "$ppa" --argjson total "$total" --argjson items "$grouped" \
              '{ppa: $ppa, total_downloads: $total, items: $items}' > "$out"
          }
          collect_ppa mp3rgain /tmp/ppa_cli.json
          collect_ppa mp3rgui /tmp/ppa_gui.json

      - name: Build stats snapshot
        run: |
          DATE=$(date -u +%Y-%m-%d)
          jq -n \
            --arg date "$DATE" \
            --slurpfile gh /tmp/github_releases.json \
            --slurpfile crates /tmp/crates_io.json \
            --slurpfile pkgstats /tmp/pkgstats.json \
            --slurpfile ppa_cli /tmp/ppa_cli.json \
            --slurpfile ppa_gui /tmp/ppa_gui.json \
            '{
              date: $date,
              github_releases: $gh[0],
              crates_io: $crates[0],
              pkgstats: $pkgstats[0],
              ppa_cli: $ppa_cli[0],
              ppa_gui: $ppa_gui[0]
            }' > /tmp/snapshot.json

      - name: Append to history
        run: |
          mkdir -p data
          if [ -f data/stats.json ]; then
            # Remove existing entry for the same date, then append
            DATE=$(date -u +%Y-%m-%d)
            jq --arg date "$DATE" '[.[] | select(.date != $date)]' data/stats.json > /tmp/existing.json
            jq -s '.[0] + [.[1]]' /tmp/existing.json /tmp/snapshot.json > data/stats.json
          else
            jq -s '.' /tmp/snapshot.json > data/stats.json
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update download stats $(date -u +%Y-%m-%d)"
          git push
