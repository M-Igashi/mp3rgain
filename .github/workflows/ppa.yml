name: PPA Upload

# Required secrets:
#   GPG_PRIVATE_KEY  - base64-encoded GPG private key (gpg --export-secret-keys KEY_ID | base64)
#   GPG_PASSPHRASE   - passphrase for the GPG key

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (cli, gui, or all)"
        type: choice
        options:
          - all
          - cli
          - gui
        default: "all"
      ppa_revision:
        description: "PPA revision number (bump if re-uploading same version)"
        type: string
        default: "1"
      target_ppa:
        description: "Target PPA (e.g. ppa:m-igashi/mp3rgain or ppa:m-igashi/mp3rgain-test)"
        type: string
        default: "ppa:m-igashi/mp3rgain"

permissions:
  contents: read

jobs:
  upload-cli:
    name: Upload mp3rgain to PPA
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'all' || inputs.package == 'cli'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper dput

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          mkdir -p ~/.gnupg
          echo "allow-preset-passphrase" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpg-connect-agent /bye
          for KG in $(gpg --with-keygrip --list-secret-keys --with-colons | grep '^grp' | cut -d: -f10); do
            /usr/lib/gnupg/gpg-preset-passphrase --preset --passphrase "$GPG_PASSPHRASE" "$KG"
          done

      - name: Get version and GPG key ID
        id: meta
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | head -1 | cut -d: -f5)
          echo "gpg_key_id=$GPG_KEY_ID" >> "$GITHUB_OUTPUT"

      - name: Vendor dependencies and create orig tarball
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG=mp3rgain
          SRC_DIR="build-ppa/${PKG}-${VERSION}"
          mkdir -p "$SRC_DIR"
          git archive HEAD | tar -x -C "$SRC_DIR"
          cd "$SRC_DIR"
          # Convert Cargo.lock v4 to v3 for compatibility with Ubuntu noble's cargo
          python3 -c "
          import re
          for lockfile in ['Cargo.lock']:
              with open(lockfile) as f: c = f.read()
              c = c.replace('version = 4', 'version = 3', 1)
              c = re.sub(r'source = \"([^\"#]+)#([^\"]+)\"', r'source = \"\1\"\nchecksum = \"\2\"', c)
              with open(lockfile, 'w') as f: f.write(c)
          "
          cargo vendor vendor
          # Strip checksum lines from Cargo.lock after vendor (cleared cargo-checksum.json invalidates them)
          sed -i '/^checksum = /d' Cargo.lock
          mkdir -p .cargo
          printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "vendor"\n' > .cargo/config.toml
          # Remove unnecessary files from vendored deps to reduce tarball size
          find vendor -name '*.a' -delete 2>/dev/null || true
          find vendor -name '*.dll' -delete 2>/dev/null || true
          find vendor -name '*.lib' -delete 2>/dev/null || true
          find vendor -type d \( -name tests -o -name examples -o -name benches -o -name .github \) -exec rm -rf {} + 2>/dev/null || true
          find vendor -name '*.md' ! -name 'README.md' -delete 2>/dev/null || true
          # Downgrade edition2024 to edition2021 and strip rust-version for Ubuntu noble's Cargo 1.75.0
          find vendor -name Cargo.toml -exec sed -i -e 's/^edition = "2024"$/edition = "2021"/' -e 's/^resolver = "3"$/resolver = "2"/' -e '/^rust-version = /d' {} +
          # Clear cargo checksums (standard practice for Debian Rust packaging)
          for f in vendor/*/.cargo-checksum.json; do echo '{"files":{}}' > "$f"; done
          rm -rf .claude .github target CLAUDE.md
          cd ../..
          tar -cJf "build-ppa/${PKG}_${VERSION}.orig.tar.xz" -C build-ppa "${PKG}-${VERSION}"

      - name: Build and upload source packages
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GPG_KEY_ID: ${{ steps.meta.outputs.gpg_key_id }}
          PPA_REV: ${{ inputs.ppa_revision || '1' }}
          TARGET_PPA: ${{ inputs.target_ppa || 'ppa:m-igashi/mp3rgain' }}
        run: |
          PKG=mp3rgain
          ORIG="build-ppa/${PKG}_${VERSION}.orig.tar.xz"
          for DISTRO in noble; do
            echo "=== Building ${PKG} for ${DISTRO} ==="
            WORK="build-ppa/build-${DISTRO}"
            mkdir -p "$WORK"
            tar -xJf "$ORIG" -C "$WORK"
            cp "$ORIG" "$WORK/"
            cp -r packages/ppa/debian "$WORK/${PKG}-${VERSION}/debian"
            PPA_VER="${VERSION}-0ppa${PPA_REV}~${DISTRO}1"
            printf '%s (%s) %s; urgency=medium\n\n  * Release %s\n\n -- M-Igashi <M-Igashi@users.noreply.github.com>  %s\n' \
              "$PKG" "$PPA_VER" "$DISTRO" "$VERSION" "$(date -R)" \
              > "$WORK/${PKG}-${VERSION}/debian/changelog"
            cd "$WORK/${PKG}-${VERSION}"
            debuild -S -sa -d -k"$GPG_KEY_ID"
            cd "$GITHUB_WORKSPACE"
            echo "=== Uploading ${PKG} for ${DISTRO} ==="
            dput "${TARGET_PPA}" "$WORK/${PKG}_${PPA_VER}_source.changes"
          done

  upload-gui:
    name: Upload mp3rgui to PPA
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'all' || inputs.package == 'gui'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper dput

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          mkdir -p ~/.gnupg
          echo "allow-preset-passphrase" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpg-connect-agent /bye
          for KG in $(gpg --with-keygrip --list-secret-keys --with-colons | grep '^grp' | cut -d: -f10); do
            /usr/lib/gnupg/gpg-preset-passphrase --preset --passphrase "$GPG_PASSPHRASE" "$KG"
          done

      - name: Get version and GPG key ID
        id: meta
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | head -1 | cut -d: -f5)
          echo "gpg_key_id=$GPG_KEY_ID" >> "$GITHUB_OUTPUT"

      - name: Vendor dependencies and create orig tarball
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG=mp3rgui
          SRC_DIR="build-ppa/${PKG}-${VERSION}"
          mkdir -p "$SRC_DIR"
          git archive HEAD | tar -x -C "$SRC_DIR"
          cd "$SRC_DIR"
          # Convert Cargo.lock v4 to v3 for compatibility with Ubuntu noble's cargo
          python3 -c "
          import re
          for lockfile in ['Cargo.lock', 'mp3rgui/Cargo.lock']:
              with open(lockfile) as f: c = f.read()
              c = c.replace('version = 4', 'version = 3', 1)
              c = re.sub(r'source = \"([^\"#]+)#([^\"]+)\"', r'source = \"\1\"\nchecksum = \"\2\"', c)
              with open(lockfile, 'w') as f: f.write(c)
          "
          cargo vendor --manifest-path mp3rgui/Cargo.toml vendor
          # Strip checksum lines from Cargo.lock after vendor (cleared cargo-checksum.json invalidates them)
          sed -i '/^checksum = /d' Cargo.lock mp3rgui/Cargo.lock
          mkdir -p .cargo
          printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "vendor"\n' > .cargo/config.toml
          # Remove unnecessary files from vendored deps to reduce tarball size
          find vendor -name '*.a' -delete 2>/dev/null || true
          find vendor -name '*.dll' -delete 2>/dev/null || true
          find vendor -name '*.lib' -delete 2>/dev/null || true
          find vendor -type d \( -name tests -o -name examples -o -name benches -o -name .github \) -exec rm -rf {} + 2>/dev/null || true
          find vendor -name '*.md' ! -name 'README.md' -delete 2>/dev/null || true
          # Stub out platform-specific crates not needed for Linux builds
          # These crates are resolved by cargo but never compiled on Linux
          for pattern in 'windows-sys-*' 'windows-core-*' 'windows-implement-*' 'windows-interface-*' \
            'windows-targets-*' 'windows_x86_64_*' 'windows_i686_*' 'windows_aarch64_*' \
            'winapi-x86_64-*' 'winapi-i686-*' \
            'd3d12-*' 'winresource-*' 'widestring-*' \
            'cocoa-*' 'cocoa-foundation-*' 'core-foundation-*' 'core-foundation-sys-*' \
            'core-graphics-*' 'core-graphics-types-*' 'metal-*' \
            'objc-*' 'objc2-*' 'objc-sys-*' 'block-*' 'block2-*' 'block-sys-*' \
            'dispatch-*' 'icrate-*' \
            'accesskit_macos-*' 'accesskit_windows-*'; do
            for crate_dir in vendor/$pattern; do
              [ -d "$crate_dir" ] || continue
              tmp_toml=$(mktemp)
              cp "$crate_dir/Cargo.toml" "$tmp_toml"
              rm -rf "$crate_dir"/*
              mv "$tmp_toml" "$crate_dir/Cargo.toml"
              echo '{"files":{}}' > "$crate_dir/.cargo-checksum.json"
              mkdir -p "$crate_dir/src"
              echo '' > "$crate_dir/src/lib.rs"
            done
          done
          # Downgrade edition2024 to edition2021 and strip rust-version for Ubuntu noble's Cargo 1.75.0
          find vendor -name Cargo.toml -exec sed -i -e 's/^edition = "2024"$/edition = "2021"/' -e 's/^resolver = "3"$/resolver = "2"/' -e '/^rust-version = /d' {} +
          # Clear cargo checksums (standard practice for Debian Rust packaging)
          for f in vendor/*/.cargo-checksum.json; do echo '{"files":{}}' > "$f"; done
          rm -rf .claude .github target CLAUDE.md
          cd ../..
          du -sh "build-ppa/${PKG}-${VERSION}/vendor"
          XZ_OPT='-9e' tar -cJf "build-ppa/${PKG}_${VERSION}.orig.tar.xz" -C build-ppa "${PKG}-${VERSION}"
          ls -lh "build-ppa/${PKG}_${VERSION}.orig.tar.xz"

      - name: Build and upload source packages
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GPG_KEY_ID: ${{ steps.meta.outputs.gpg_key_id }}
          PPA_REV: ${{ inputs.ppa_revision || '1' }}
          TARGET_PPA: ${{ inputs.target_ppa || 'ppa:m-igashi/mp3rgain' }}
        run: |
          PKG=mp3rgui
          ORIG="build-ppa/${PKG}_${VERSION}.orig.tar.xz"
          for DISTRO in noble; do
            echo "=== Building ${PKG} for ${DISTRO} ==="
            WORK="build-ppa/build-${DISTRO}"
            mkdir -p "$WORK"
            tar -xJf "$ORIG" -C "$WORK"
            cp "$ORIG" "$WORK/"
            cp -r packages/ppa-gui/debian "$WORK/${PKG}-${VERSION}/debian"
            PPA_VER="${VERSION}-0ppa${PPA_REV}~${DISTRO}1"
            printf '%s (%s) %s; urgency=medium\n\n  * Release %s\n\n -- M-Igashi <M-Igashi@users.noreply.github.com>  %s\n' \
              "$PKG" "$PPA_VER" "$DISTRO" "$VERSION" "$(date -R)" \
              > "$WORK/${PKG}-${VERSION}/debian/changelog"
            cd "$WORK/${PKG}-${VERSION}"
            debuild -S -sa -d -k"$GPG_KEY_ID"
            cd "$GITHUB_WORKSPACE"
            echo "=== Uploading ${PKG} for ${DISTRO} ==="
            dput "${TARGET_PPA}" "$WORK/${PKG}_${PPA_VER}_source.changes"
          done
