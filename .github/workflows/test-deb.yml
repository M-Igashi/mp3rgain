name: Test Debian Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  push:
    tags-ignore:
      - "v*"
    paths:
      - "packages/debian/**"
      - "packages/debian-gui/**"
      - ".github/workflows/test-deb.yml"
  pull_request:
    paths:
      - "packages/debian/**"
      - "packages/debian-gui/**"
      - ".github/workflows/test-deb.yml"

permissions: {}

jobs:
  test-deb:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            name: Debian 12 (bookworm)
          - distro: debian:trixie
            name: Debian 13 (trixie)
          - distro: ubuntu:22.04
            name: Ubuntu 22.04 LTS
          - distro: ubuntu:24.04
            name: Ubuntu 24.04 LTS

    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl ca-certificates

      - name: Download .deb package
        run: |
          # Get the latest .deb filename from releases
          DEB_URL=$(curl -sL https://api.github.com/repos/M-Igashi/mp3rgain/releases/latest \
            | grep -o 'https://[^"]*\.deb"' | tr -d '"' | head -1)
          echo "Downloading: $DEB_URL"
          curl -sL -o mp3rgain.deb "$DEB_URL"
          ls -la mp3rgain.deb

      - name: Install package
        run: |
          apt-get install -y ./mp3rgain.deb
          echo "Package installed successfully"

      - name: Verify binary
        run: |
          which mp3rgain
          mp3rgain --version
          mp3rgain --help | head -20

      - name: Verify man page
        run: |
          apt-get install -y man-db
          # Man page was added in v1.5.0+, check if it exists
          if man -w mp3rgain 2>/dev/null; then
            echo "Man page found:"
            man mp3rgain | head -30
          else
            echo "Man page not found (expected for versions < 1.5.0)"
          fi

      - name: Test basic functionality
        run: |
          # Create a simple test (just verify the binary runs)
          mp3rgain --version
          echo "Basic functionality test passed"

  test-deb-gui:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Test GUI on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            name: Debian 12 (bookworm)
          - distro: debian:trixie
            name: Debian 13 (trixie)
          - distro: ubuntu:22.04
            name: Ubuntu 22.04 LTS
          - distro: ubuntu:24.04
            name: Ubuntu 24.04 LTS

    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl ca-certificates

      - name: Download GUI .deb package
        run: |
          # Get the latest GUI .deb filename from releases
          DEB_URL=$(curl -sL https://api.github.com/repos/M-Igashi/mp3rgain/releases/latest \
            | grep -o 'https://[^"]*mp3rgui[^"]*\.deb"' | tr -d '"' | head -1)
          echo "Downloading: $DEB_URL"
          curl -sL -o mp3rgui.deb "$DEB_URL"
          ls -la mp3rgui.deb

      - name: Install package
        run: |
          apt-get install -y ./mp3rgui.deb
          echo "Package installed successfully"

      - name: Verify binary
        run: |
          which mp3rgui
          mp3rgui --version || true

      - name: Verify desktop file
        run: |
          test -f /usr/share/applications/mp3rgui.desktop && echo "Desktop file found" || echo "Desktop file not found"

      - name: Verify icon
        run: |
          test -f /usr/share/icons/hicolor/128x128/apps/mp3rgui.png && echo "Icon found" || echo "Icon not found"
